{% extends 'mail/base.html' %}
{% block title %}{{ object.full_name }}{% endblock %}

{% block content %}
<!-- Контент -->


<div class="col-md-4 d-flex justify-content-center align-items-stretch p-3">
  <div class="card border-0 shadow-lg w-100" style="background-color: #212529;">
      <div class="text-center">
          <span class="fs-3 p-3 text-white">{{ object.subject }}</span>
      </div>
      <hr class="white-hr">
      <div class="card-body">
          <p class="card-text text-white">{{ object.letter_body }}</p>
          <a href="{% url 'mail:letter_update' letter.pk %}" class="btn text-white" style="background-color: #1a1c1f;">Изменить "{{ object.subject}}"</a>
          <a href="{% url 'mail:letter_delete' letter.pk %}" class="btn text-white" style="background-color: #1a1c1f;">Удалить "{{ object.subject }}"</a>
      </div>
  </div>
</div>
{% endblock %}
