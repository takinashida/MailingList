{% extends 'base.html' %}
{% block title %}Профили{% endblock %}

{% block content %}
<!-- Контент -->

{% for object in object_list %}
    <div class="col-md-4 d-flex justify-content-center align-items-stretch p-3">
      <div class="card border-0 shadow-lg w-100" style="background-color: #212529;">
          <div class="text-center">
              <span class="fs-3 p-3 text-white">{{ object.username}}</span>
              <br>
              <span class="fs-6 text-white">{{ object.email }}</span>
          </div>
          <hr class="white-hr">
          <form action="{% url 'users:profile_block' object.pk %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-primary" style="background-color: #1a1c1f;">Заблокировать пользователя</button>
          </form>
      </div>
    </div>
{% endfor %}
{% endblock %}
